name: Update ETF monthly returns

on:
  schedule:
    - cron: '33 6,11,15 * * 1-5'   # 台北 14:33 / 19:33 / 23:33（週一～週五）
    - cron: '33 2 1-3 * *'         # 台北每月 1～3 號 10:33（含週末，月底收盤價的保險）
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式：normal 正常更新；probe 只檢查資料來源、不寫檔；rebuild 丟掉現有資料從頭補抓'
        type: choice
        options: [normal, probe, rebuild]
        default: normal

permissions:
  contents: write

concurrency:
  group: etf-monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 抓資料
        id: run
        continue-on-error: true   # 「缺資料」時仍要把其他資料存回去，最後一步再亮紅燈
        run: node scripts/update.mjs "${{ github.event.inputs.mode || 'normal' }}"

      - name: 存回 repo
        if: (github.event.inputs.mode || 'normal') != 'probe'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變更，不需要 commit"
            exit 0
          fi
          git commit -m "Update data $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 被拒（可能剛好有人上傳檔案），rebase 後重試第 $i 次"
            git pull --rebase --autostash
          done
          exit 1

      - name: 結果
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::抓取程式回報失敗，請展開上面「抓資料」步驟看原因"
          exit 1
